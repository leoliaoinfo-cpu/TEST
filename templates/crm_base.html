<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRM{% endblock %} — 業務管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 220px;
      --sidebar-bg: #1a2035;
      --sidebar-active: #3d5a99;
      --topbar-h: 56px;
    }
    body { background: #f4f6fb; min-height: 100vh; }

    /* Sidebar */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      z-index: 1000; overflow-y: auto;
    }
    #sidebar .brand {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    #sidebar .brand h6 {
      color: #fff; font-weight: 700; font-size: .95rem; margin: 0;
    }
    #sidebar .brand small { color: #8899bb; font-size: .72rem; }
    #sidebar .nav-section {
      padding: 12px 14px 4px;
      font-size: .68rem; color: #5a6e8c;
      text-transform: uppercase; letter-spacing: .06em;
    }
    #sidebar .nav-link {
      color: #b0bcd4; padding: 8px 20px;
      display: flex; align-items: center; gap: 10px;
      font-size: .875rem; border-radius: 6px; margin: 1px 8px;
      transition: background .15s, color .15s;
    }
    #sidebar .nav-link:hover   { background: rgba(255,255,255,.07); color: #fff; }
    #sidebar .nav-link.active  { background: var(--sidebar-active); color: #fff; }
    #sidebar .nav-link .bi { font-size: 1rem; }

    /* Main */
    #main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
    #topbar {
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid #e5e9f0;
      display: flex; align-items: center; padding: 0 24px;
      position: sticky; top: 0; z-index: 900;
    }
    #topbar h5 { margin: 0; font-size: 1rem; font-weight: 600; color: #2d3a4a; }
    .page-content { padding: 28px 28px; flex: 1; }

    /* Cards */
    .stat-card {
      background: #fff; border-radius: 12px; padding: 20px 22px;
      border: 1px solid #e8edf5;
      transition: box-shadow .2s;
    }
    .stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
    .stat-card .icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .stat-card .value { font-size: 1.7rem; font-weight: 700; line-height: 1; color: #1a2035; }
    .stat-card .label { font-size: .78rem; color: #8899aa; margin-top: 4px; }

    /* Table */
    .crm-table { background: #fff; border-radius: 12px; border: 1px solid #e8edf5; overflow: hidden; }
    .crm-table table { margin: 0; }
    .crm-table thead th { background: #f8fafd; font-size: .8rem; color: #5a6e8c;
      text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #e8edf5; }
    .crm-table td { vertical-align: middle; font-size: .875rem; }

    /* Badges */
    .stage-badge { font-size: .72rem; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

    /* Timeline */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
      width: 2px; background: #e8edf5;
    }
    .tl-item { position: relative; margin-bottom: 20px; }
    .tl-dot {
      position: absolute; left: -24px; top: 4px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; border: 2px solid #3d5a99;
    }
    .tl-card {
      background: #fff; border: 1px solid #e8edf5; border-radius: 10px; padding: 14px 16px;
    }
    .tl-meta { font-size: .75rem; color: #8899aa; }

    /* Pipeline */
    .pipeline-col {
      min-width: 220px; background: #f8fafd;
      border-radius: 12px; border: 1px solid #e8edf5;
    }
    .pipeline-col .col-header {
      padding: 12px 14px; border-bottom: 1px solid #e8edf5;
      font-size: .8rem; font-weight: 600; color: #3a4a5c;
    }
    .opp-card {
      background: #fff; border: 1px solid #e8edf5; border-radius: 8px;
      padding: 12px 14px; margin: 8px; font-size: .84rem;
    }
    .opp-card .amt { font-weight: 700; color: #1a2035; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="brand">
    <h6><i class="bi bi-diagram-3-fill me-2" style="color:#6ea8fe"></i>業務 CRM</h6>
    <small>客戶關係管理系統</small>
  </div>

  <div class="mt-2">
    <div class="nav-section">主選單</div>
    <a href="{{ url_for('dashboard') }}"
       class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> 儀表板
    </a>
    <a href="{{ url_for('customers') }}"
       class="nav-link {% if 'customer' in request.endpoint %}active{% endif %}">
      <i class="bi bi-people-fill"></i> 客戶管理
    </a>
    <a href="{{ url_for('opportunities') }}"
       class="nav-link {% if 'opportunit' in request.endpoint %}active{% endif %}">
      <i class="bi bi-lightning-charge-fill"></i> 商機追蹤
    </a>
  </div>
</nav>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <h5>{% block page_title %}{% endblock %}</h5>
    <div class="ms-auto d-flex gap-2">
      <a href="{{ url_for('customer_new') }}" class="btn btn-sm btn-primary">
        <i class="bi bi-plus-lg me-1"></i>新增客戶
      </a>
    </div>
  </div>

  <div class="page-content">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show py-2 mb-3" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
