<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 智腦記事本</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ── Reset & base ───────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────── */
  .header {
    background: #1e293b;
    color: #f8fafc;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 10;
  }
  .header-logo { font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
  .header-search {
    flex: 1;
    display: flex;
    gap: 8px;
    max-width: 560px;
    margin: 0 auto;
  }
  .header-search input {
    flex: 1;
    padding: 7px 14px;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: #f8fafc;
    font-size: .9rem;
    outline: none;
  }
  .header-search input::placeholder { color: #94a3b8; }
  .header-search input:focus { background: #3e5270; }
  .header-actions { display: flex; gap: 8px; }

  /* ── Buttons ─────────────────────────────────────── */
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: opacity .15s, transform .1s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary   { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled)  { background: #4338ca; }
  .btn-violet    { background: #7c3aed; color: #fff; }
  .btn-violet:hover:not(:disabled)   { background: #6d28d9; }
  .btn-teal      { background: #0d9488; color: #fff; }
  .btn-teal:hover:not(:disabled)     { background: #0f766e; }
  .btn-amber     { background: #d97706; color: #fff; }
  .btn-amber:hover:not(:disabled)    { background: #b45309; }
  .btn-rose      { background: #e11d48; color: #fff; }
  .btn-rose:hover:not(:disabled)     { background: #be123c; }
  .btn-slate     { background: #475569; color: #fff; }
  .btn-slate:hover:not(:disabled)    { background: #334155; }
  .btn-ghost     { background: #e2e8f0; color: #374151; }
  .btn-ghost:hover:not(:disabled)    { background: #cbd5e1; }
  .btn-sm        { padding: 5px 10px; font-size: .8rem; }

  /* ── Layout ──────────────────────────────────────── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────────────────── */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: #1e293b;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid #0f172a;
  }
  .sidebar-top {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid #334155;
  }
  .sidebar-top .btn { width: 100%; justify-content: center; }
  .notes-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .notes-list::-webkit-scrollbar { width: 4px; }
  .notes-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  .note-item {
    padding: 10px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .15s;
  }
  .note-item:hover { background: #334155; }
  .note-item.active { background: #334155; border-left-color: #6366f1; }
  .note-item-title {
    font-size: .88rem;
    font-weight: 600;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-item-meta {
    font-size: .75rem;
    color: #94a3b8;
    margin-top: 3px;
  }
  .note-item-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .tag {
    background: #312e81;
    color: #a5b4fc;
    font-size: .7rem;
    padding: 1px 6px;
    border-radius: 100px;
  }
  .sidebar-bottom {
    padding: 12px;
    border-top: 1px solid #334155;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sidebar-bottom .btn { width: 100%; justify-content: center; }
  .note-count {
    text-align: center;
    font-size: .75rem;
    color: #64748b;
    padding: 4px 0;
  }

  /* ── Main content ────────────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #f1f5f9;
  }

  /* ── Note view ───────────────────────────────────── */
  .note-view {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: none;
  }
  .note-view.visible { display: block; }
  .note-view::-webkit-scrollbar { width: 6px; }
  .note-view::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .note-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  .note-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.3;
  }
  .note-actions { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .note-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .note-tag {
    background: #ddd6fe;
    color: #5b21b6;
    font-size: .78rem;
    padding: 2px 10px;
    border-radius: 100px;
    font-weight: 500;
  }
  .note-meta {
    font-size: .78rem;
    color: #94a3b8;
    margin-bottom: 20px;
  }
  .note-body {
    background: #fff;
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    line-height: 1.7;
    font-size: .95rem;
    color: #1e293b;
  }
  .note-body h1, .note-body h2, .note-body h3 { margin: 1em 0 .5em; color: #0f172a; }
  .note-body p { margin-bottom: .8em; }
  .note-body ul, .note-body ol { padding-left: 1.5em; margin-bottom: .8em; }
  .note-body li { margin-bottom: .3em; }
  .note-body code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .note-body pre { background: #1e293b; color: #e2e8f0; padding: 14px; border-radius: 8px; overflow-x: auto; margin-bottom: .8em; }
  .note-body pre code { background: none; padding: 0; }
  .note-body strong { font-weight: 700; }
  .note-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5em 0; }
  .note-body blockquote { border-left: 3px solid #6366f1; padding-left: 14px; color: #64748b; margin: .8em 0; }

  /* ── AI output panel ─────────────────────────────── */
  .ai-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .ai-panel.visible { display: flex; }
  .ai-panel-header {
    padding: 16px 28px 12px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ai-panel-title {
    font-weight: 700;
    font-size: 1rem;
    color: #1e293b;
    flex: 1;
  }
  .ai-stream-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 32px 24px;
  }
  .ai-stream-area::-webkit-scrollbar { width: 6px; }
  .ai-stream-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .ai-bubble {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    border: 1px solid #e2e8f0;
    line-height: 1.7;
    font-size: .95rem;
    color: #1e293b;
    min-height: 80px;
  }
  .ai-bubble h1, .ai-bubble h2, .ai-bubble h3 { margin: 1em 0 .5em; color: #0f172a; }
  .ai-bubble p { margin-bottom: .8em; }
  .ai-bubble ul, .ai-bubble ol { padding-left: 1.5em; margin-bottom: .8em; }
  .ai-bubble li { margin-bottom: .3em; }
  .ai-bubble code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .ai-bubble pre { background: #1e293b; color: #e2e8f0; padding: 14px; border-radius: 8px; overflow-x: auto; margin-bottom: .8em; }
  .ai-bubble pre code { background: none; padding: 0; }
  .ai-bubble strong { font-weight: 700; }
  .ai-bubble hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5em 0; }
  .ai-bubble blockquote { border-left: 3px solid #6366f1; padding-left: 14px; color: #64748b; margin: .8em 0; }
  .ai-results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ai-result-item {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .ai-result-item:hover { background: #dbeafe; }
  .ai-result-item-title { font-weight: 600; font-size: .9rem; color: #1d4ed8; }
  .ai-result-item-snippet { font-size: .82rem; color: #475569; margin-top: 3px; }
  .status-bar {
    padding: 8px 28px;
    font-size: .8rem;
    color: #64748b;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid #cbd5e1;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty state ─────────────────────────────────── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    gap: 12px;
  }
  .empty-state.hidden { display: none; }
  .empty-state-icon { font-size: 3rem; }
  .empty-state-text { font-size: 1rem; }

  /* ── Modal ───────────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    width: 540px;
    max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: .85rem; font-weight: 600; color: #374151; }
  .form-input {
    padding: 9px 13px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: .9rem;
    color: #0f172a;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  .form-input:focus { border-color: #6366f1; }
  textarea.form-input { resize: vertical; min-height: 120px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* ── Summarize bar ───────────────────────────────── */
  .summarize-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 28px;
    background: #fff7ed;
    border-bottom: 1px solid #fed7aa;
  }
  .summarize-bar.visible { display: flex; }
  .summarize-bar input {
    flex: 1;
    padding: 7px 12px;
    border: 1.5px solid #fb923c;
    border-radius: 8px;
    font-size: .9rem;
    outline: none;
    font-family: inherit;
    color: #0f172a;
  }
  .summarize-bar input:focus { border-color: #ea580c; }

  /* ── Toast ───────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1e293b;
    color: #f8fafc;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: .88rem;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s;
    max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-left: 4px solid #10b981; }
  .toast.error   { border-left: 4px solid #e11d48; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-logo">🧠 智腦記事本</div>
  <div class="header-search">
    <input id="searchInput" type="text" placeholder="搜尋筆記…（支援 AI 語意理解）"
      onkeydown="if(event.key==='Enter') doSearch()">
    <button class="btn btn-primary" onclick="doSearch()">🔍 搜尋</button>
  </div>
  <div class="header-actions">
    <button class="btn btn-amber" onclick="toggleSummarizeBar()">📚 合成摘要</button>
  </div>
</header>

<!-- Summarize bar -->
<div class="summarize-bar" id="summarizeBar">
  <span style="font-size:.85rem;font-weight:600;color:#92400e;white-space:nowrap">合成主題摘要：</span>
  <input id="summarizeInput" type="text" placeholder="輸入主題（例如：Python、機器學習…）"
    onkeydown="if(event.key==='Enter') doSummarize()">
  <button class="btn btn-amber btn-sm" onclick="doSummarize()">產生摘要</button>
  <button class="btn btn-ghost btn-sm" onclick="toggleSummarizeBar()">✕</button>
</div>

<!-- Main layout -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="btn btn-primary" onclick="openAddModal()">✏️ 新增筆記</button>
    </div>
    <div class="notes-list" id="notesList"></div>
    <div class="sidebar-bottom">
      <button class="btn btn-violet" onclick="doAnalyze()">🔬 分析知識缺口</button>
      <div class="note-count" id="noteCount"></div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">📝</div>
      <div class="empty-state-text">點選左側筆記，或使用搜尋開始</div>
    </div>

    <!-- Note view -->
    <div class="note-view" id="noteView">
      <div class="note-header">
        <div class="note-title" id="noteTitle"></div>
        <div class="note-actions" id="noteActions"></div>
      </div>
      <div class="note-tags" id="noteTags"></div>
      <div class="note-meta" id="noteMeta"></div>
      <div class="note-body" id="noteBody"></div>
    </div>

    <!-- AI panel -->
    <div class="ai-panel" id="aiPanel">
      <div class="ai-panel-header">
        <div class="ai-panel-title" id="aiPanelTitle">🤖 AI 回應</div>
        <button class="btn btn-ghost btn-sm" onclick="closeAiPanel()">✕ 關閉</button>
      </div>
      <div class="ai-stream-area">
        <div class="ai-bubble" id="aiBubble"></div>
        <div class="ai-results" id="aiResults"></div>
      </div>
      <div class="status-bar" id="statusBar">就緒</div>
    </div>

  </main>
</div>

<!-- Add Note Modal -->
<div class="modal-overlay" id="addModal" onclick="if(event.target===this) closeAddModal()">
  <div class="modal">
    <div class="modal-title">✏️ 新增筆記</div>
    <div class="form-group">
      <label class="form-label">標題</label>
      <input class="form-input" id="newTitle" type="text" placeholder="筆記標題…"
        onkeydown="if(event.key==='Enter') document.getElementById('newContent').focus()">
    </div>
    <div class="form-group">
      <label class="form-label">內容</label>
      <textarea class="form-input" id="newContent" placeholder="筆記內容…（支援 Markdown 格式）"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" id="addBtn" onclick="submitAddNote()">💾 儲存（AI 自動標籤）</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ───────────────────────────────────────────
let currentNoteId = null;
let notes = [];

// ── Init ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadNotes);

// ── Data ────────────────────────────────────────────
async function loadNotes() {
  const res = await fetch('/api/notes');
  notes = await res.json();
  renderNoteList();
}

function renderNoteList() {
  const list = document.getElementById('notesList');
  const count = document.getElementById('noteCount');
  count.textContent = `共 ${notes.length} 篇筆記`;
  if (!notes.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#64748b;font-size:.83rem">尚無筆記<br>點上方按鈕新增</div>';
    return;
  }
  list.innerHTML = notes.map(n => {
    const tagHtml = n.tags.map(t => `<span class="tag">${t}</span>`).join('');
    const date = n.updated_at.slice(0, 10);
    return `
      <div class="note-item ${n.id === currentNoteId ? 'active' : ''}"
           onclick="viewNote(${n.id})">
        <div class="note-item-title">${esc(n.title)}</div>
        <div class="note-item-meta">${date}</div>
        ${tagHtml ? `<div class="note-item-tags">${tagHtml}</div>` : ''}
      </div>`;
  }).join('');
}

// ── View note ────────────────────────────────────────
async function viewNote(id) {
  currentNoteId = id;
  closeAiPanel();
  const res = await fetch(`/api/notes/${id}`);
  if (!res.ok) { showToast('找不到筆記', 'error'); return; }
  const note = await res.json();

  show('noteView');
  hide('emptyState');

  document.getElementById('noteTitle').textContent = note.title;
  document.getElementById('noteMeta').textContent =
    `建立：${note.created_at.slice(0,19)}　更新：${note.updated_at.slice(0,19)}`;

  const tagsEl = document.getElementById('noteTags');
  tagsEl.innerHTML = note.tags.map(t => `<span class="note-tag">#${t}</span>`).join('');

  document.getElementById('noteBody').innerHTML = marked.parse(note.content);

  document.getElementById('noteActions').innerHTML = `
    <button class="btn btn-teal btn-sm" onclick="doAugment(${id})">🤖 補充知識</button>
    <button class="btn btn-violet btn-sm" onclick="doImprove(${id})">✨ 改善筆記</button>
    <button class="btn btn-slate btn-sm" onclick="doAutotag(${id})">🏷 自動標籤</button>
    <button class="btn btn-rose btn-sm" onclick="doDelete(${id})">🗑 刪除</button>
  `;

  renderNoteList(); // refresh active state
}

// ── Add note ─────────────────────────────────────────
function openAddModal() {
  document.getElementById('newTitle').value = '';
  document.getElementById('newContent').value = '';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newTitle').focus(), 50);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}
async function submitAddNote() {
  const title   = document.getElementById('newTitle').value.trim();
  const content = document.getElementById('newContent').value.trim();
  if (!title || !content) { showToast('標題和內容不能為空', 'error'); return; }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '儲存中…';

  const res = await fetch('/api/notes', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({title, content})
  });
  const note = await res.json();
  btn.disabled = false;
  btn.innerHTML = '💾 儲存（AI 自動標籤）';
  closeAddModal();
  await loadNotes();
  viewNote(note.id);
  showToast(`✓ 已新增筆記並自動標籤`, 'success');
}

// ── Delete ───────────────────────────────────────────
async function doDelete(id) {
  const note = notes.find(n => n.id === id);
  if (!confirm(`確定刪除「${note?.title}」？此操作無法復原。`)) return;
  await fetch(`/api/notes/${id}`, {method:'DELETE'});
  currentNoteId = null;
  show('emptyState');
  hide('noteView');
  closeAiPanel();
  await loadNotes();
  showToast('筆記已刪除', 'success');
}

// ── Autotag ──────────────────────────────────────────
async function doAutotag(id) {
  showToast('AI 標籤產生中…');
  const res = await fetch(`/api/notes/${id}/autotag`, {method:'POST'});
  const data = await res.json();
  await loadNotes();
  if (currentNoteId === id) viewNote(id);
  showToast(`✓ 標籤：${data.tags.join(', ')}`, 'success');
}

// ── Search ───────────────────────────────────────────
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  showAiPanel(`🔍 搜尋：「${query}」`);
  streamSSE('/api/search', {method:'POST', body:{query}}, results => {
    if (!results) return;
    const el = document.getElementById('aiResults');
    el.innerHTML = results.map(r => `
      <div class="ai-result-item" onclick="viewNote(${r.id})">
        <div class="ai-result-item-title">#${r.id} ${esc(r.title)}</div>
        <div class="ai-result-item-snippet">${esc(r.snippet)}</div>
      </div>`).join('');
  });
}

// ── SSE streaming helper ─────────────────────────────
function streamSSE(url, opts, onDone) {
  const method = opts.method || 'GET';
  const fetchOpts = { method };
  if (opts.body) {
    fetchOpts.headers = {'Content-Type':'application/json'};
    fetchOpts.body = JSON.stringify(opts.body);
  }

  const bubble = document.getElementById('aiBubble');
  const statusBar = document.getElementById('statusBar');
  bubble.innerHTML = '';
  document.getElementById('aiResults').innerHTML = '';

  setStatus(true, 'AI 思考中…');

  let rawText = '';

  fetch(url, fetchOpts).then(res => {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    function pump() {
      reader.read().then(({ done, value }) => {
        if (done) {
          setStatus(false, '完成');
          return;
        }
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const evt = JSON.parse(line.slice(6));
            if (evt.type === 'text') {
              rawText += evt.content;
              bubble.innerHTML = marked.parse(rawText);
              bubble.scrollIntoView({ behavior:'smooth', block:'end' });
            } else if (evt.type === 'done') {
              setStatus(false, evt.message || '完成');
              if (evt.results) onDone && onDone(evt.results);
              else onDone && onDone(null);
              if (evt.message) showToast('✓ ' + evt.message, 'success');
            } else if (evt.type === 'error') {
              setStatus(false, '錯誤：' + evt.message);
              bubble.innerHTML += `<p style="color:#e11d48">⚠️ ${esc(evt.message)}</p>`;
              showToast(evt.message, 'error');
            }
          } catch (e) {}
        }
        pump();
      });
    }
    pump();
  }).catch(e => {
    setStatus(false, '連線失敗');
    showToast('無法連線到伺服器', 'error');
  });
}

// ── AI panel helpers ─────────────────────────────────
function showAiPanel(title) {
  document.getElementById('aiPanelTitle').textContent = title;
  hide('noteView');
  hide('emptyState');
  show('aiPanel');
}
function closeAiPanel() {
  hide('aiPanel');
  if (currentNoteId) show('noteView');
  else show('emptyState');
}

// ── Status bar ───────────────────────────────────────
function setStatus(loading, text) {
  const bar = document.getElementById('statusBar');
  bar.innerHTML = loading
    ? `<div class="spinner"></div><span>${text}</span>`
    : `<span>${text}</span>`;
}

// ── Utilities ────────────────────────────────────────
function show(id) { document.getElementById(id).classList.add('visible'); }
function hide(id) { document.getElementById(id).classList.remove('visible'); }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Close modal on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddModal();
});
