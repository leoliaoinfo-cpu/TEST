{% extends "crm_base.html" %}
{% block title %}{% if customer %}編輯客戶{% else %}新增客戶{% endif %}{% endblock %}
{% block page_title %}{% if customer %}編輯客戶{% else %}新增客戶{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">姓名 <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required
                     value="{{ customer.name if customer else '' }}" placeholder="客戶姓名">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">公司</label>
              <input type="text" name="company" class="form-control"
                     value="{{ customer.company if customer else '' }}" placeholder="公司名稱">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">職稱</label>
              <input type="text" name="title" class="form-control"
                     value="{{ customer.title if customer else '' }}" placeholder="職稱">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">電話</label>
              <input type="text" name="phone" class="form-control"
                     value="{{ customer.phone if customer else '' }}" placeholder="電話號碼">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control"
                     value="{{ customer.email if customer else '' }}" placeholder="email@example.com">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">地址</label>
              <input type="text" name="address" class="form-control"
                     value="{{ customer.address if customer else '' }}" placeholder="聯絡地址">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">產業</label>
              <select name="industry" class="form-select">
                <option value="">請選擇…</option>
                {% for ind in INDUSTRIES %}
                  <option value="{{ ind }}" {% if customer and customer.industry==ind %}selected{% endif %}>{{ ind }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">狀態</label>
              <select name="status" class="form-select">
                {% for val, lbl in STATUSES %}
                  <option value="{{ val }}"
                    {% if customer and customer.status==val %}selected
                    {% elif not customer and val=='prospect' %}selected
                    {% endif %}>{{ lbl }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">來源</label>
              <select name="source" class="form-select">
                <option value="">請選擇…</option>
                {% for src in SOURCES %}
                  <option value="{{ src }}" {% if customer and customer.source==src %}selected{% endif %}>{{ src }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">備註</label>
              <textarea name="notes" class="form-control" rows="3"
                        placeholder="其他備註事項…">{{ customer.notes if customer else '' }}</textarea>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>{% if customer %}儲存變更{% else %}新增客戶{% endif %}
            </button>
            {% if customer %}
              <a href="{{ url_for('customer_detail', cid=customer.id) }}" class="btn btn-outline-secondary">取消</a>
            {% else %}
              <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">取消</a>
            {% endif %}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
