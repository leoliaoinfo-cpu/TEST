services:
  - type: web
    name: stocklens
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set manually in Render dashboard
      - key: WEBHOOK_URL
        sync: false          # https://<your-app>.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINMIND_TOKEN
        sync: false          # optional — raises FinMind free-tier limit
      - key: WEBHOOK_SECRET
        generateValue: true  # Render auto-generates a random secret
